<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promotion</title>
    <style>
        body {
            background-color: #0d0d0d;
            background-image: url('bg.avif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(8px);
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 1.8rem;
            margin-bottom: 0.8rem;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.4rem;
        }

        p {
            color: #a0a0a0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        a {
            color: #64b5f6;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #90caf9;
            text-decoration: underline;
        }

        /* Social Links Bar */
        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .social-link {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.1);
            text-decoration: none;
        }

        /* Clickable Project Card */
        .project-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project-block {
            background: rgba(255, 255, 255, 0.04);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .project-card-link:hover .project-block {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .project-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .project-img {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            object-fit: cover;
        }

        .project-title h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
            color: #fff;
        }

        .project-title p {
            margin: 0;
            font-size: 0.8rem;
            color: #888;
        }

        /* Audio Section */
        .audio-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .track {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-title {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: #d1d1d1;
        }

        audio {
            width: 100%;
            height: 36px;
            outline: none;
        }

        /* Credits & Footer */
        .credits {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }

        .footer-copyright {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>promotion</h1>
        <p>Welcome to my portfolio space.</p>

        <!-- SOCIAL LINKS (UPDATE URLS TO YOUR PROFILES) -->
        <div class="social-links">
            <a href="https://x.com/YOUR_HANDLE" target="_blank" rel="noopener noreferrer" class="social-link">X (Twitter)</a>
            <a href="https://youtube.com/@YOUR_HANDLE" target="_blank" rel="noopener noreferrer" class="social-link">YouTube</a>
            <a href="https://discord.gg/YOUR_INVITE" target="_blank" rel="noopener noreferrer" class="social-link">Discord</a>
        </div>

        <!-- PROJECTS SECTION -->
        <h2>Projects</h2>
        <a href="j7.html" class="project-card-link">
            <div class="project-block">
                <div class="project-header">
                    <img src="j7_lineageos.png" alt="J7 LineageOS" class="project-img" onerror="this.style.display='none'">
                    <div class="project-title">
                        <h3>Samsung Galaxy J7 LineageOS</h3>
                        <p>Click to read full story</p>
                    </div>
                </div>
            </div>
        </a>

        <!-- MUSIC SECTION -->
        <h2>Music</h2>
        <div class="audio-section">
            <div class="track">
                <div class="track-title">staircase</div>
                <audio controls>
                    <source src="staircase.wav" type="audio/wav">
                </audio>
            </div>

            <div class="track">
                <div class="track-title">bedroom bound dreams</div>
                <audio controls>
                    <source src="bedroom bound dreams.wav" type="audio/wav">
                </audio>
            </div>
        </div>

        <div class="credits">
            Music & Content by <a href="https://www.youtube.com/@frokfrdk" target="_blank" rel="noopener noreferrer">@frokfrdk</a>
        </div>

        <!-- COPYRIGHT FOOTER -->
        <div class="footer-copyright">
            &copy; 2026 promotion. All rights reserved.
        </div>
    </div>

</body>
</html>
