<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promotion</title>
    <style>
        body {
            background-color: #0d0d0d;
            background-image: url('bg.avif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(8px);
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p {
            color: #a0a0a0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        a {
            color: #64b5f6;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #90caf9;
            text-decoration: underline;
        }

        .audio-section {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .track {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #d1d1d1;
        }

        audio {
            width: 100%;
            height: 36px;
            outline: none;
        }

        .credits {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>promotion</h1>
        <p>Welcome to my portfolio space.</p>

        <div class="audio-section">
            <div class="track">
                <div class="track-title">staircase</div>
                <audio controls>
                    <source src="staircase.wav" type="audio/wav">
                    Your browser does not support the audio element.
                </audio>
            </div>

            <div class="track">
                <div class="track-title">bedroom bound dreams</div>
                <audio controls>
                    <source src="bedroom bound dreams.wav" type="audio/wav">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>

        <div class="credits">
            Music & Content by <a href="https://www.youtube.com/@frokfrdk" target="_blank" rel="noopener noreferrer">@frokfrdk</a>
        </div>
    </div>

</body>
</html>
